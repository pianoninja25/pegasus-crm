# Production stack for Pegasus CRM (self-hosted on a VM).
#
# Includes the app + backing services + Caddy reverse proxy.
# Caddy fetches an HTTPS cert from Let's Encrypt automatically as long as
# the DNS record for ${APP_DOMAIN} points at this VM.
#
# Usage on the VM:
#   cp .env.example .env.prod        # fill in real values
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# To swap MinIO for Cloudflare R2, remove the `minio` + `minio-init` services
# and point the app's S3_* env vars at R2 instead.

name: pegasus-crm-prod

services:
  # One-shot: applies pending Drizzle migrations, then exits with code 0.
  # `app` depends on this succeeding, so migrations always run before the
  # web server accepts traffic.
  migrator:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    restart: "no"
    environment:
      NODE_ENV: production
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL}
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy

  # Opt-in seeder — only runs when the `seed` compose profile is enabled:
  #   docker compose -f docker-compose.prod.yml --profile seed up seeder
  # Loads the demo mock dataset (72 customers, 4 tenants, etc.) into the DB.
  # Safe to run against a fresh instance only — it TRUNCATEs first.
  seeder:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    profiles: ["seed"]
    restart: "no"
    environment:
      NODE_ENV: production
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL}
      DATABASE_URL: ${DATABASE_URL}
    command: ["npx", "tsx", "src/db/seed.ts"]
    depends_on:
      migrator:
        condition: service_completed_successfully

  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Explicit target — the Dockerfile has `migrator` as its final stage,
      # so without `target: runner` Docker would build the migrator here too.
      target: runner
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET:-pegasus}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    expose:
      - "3000"
    healthcheck:
      # node:20-alpine has neither wget nor curl, but does have Node 20's
      # global fetch(), so probe via `node -e`.
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Consumed by docker/postgres-init/01-app-user.sh on first boot.
      PEGASUS_APP_USER: ${PEGASUS_APP_USER}
      PEGASUS_APP_PASSWORD: ${PEGASUS_APP_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/${S3_BUCKET:-pegasus} &&
      echo 'MinIO bucket ready.'
      "
    restart: "no"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
